<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101713"><title>延西易创 · 八字五行查询</title><meta name="description" content="输入出生信息，查询八字简要与五行统计，查看表层五行最少的属性和财星属性。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101713'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23d8bd81' stroke-width='2'/%3E%3Cpath d='M10 11h12M9 16h14M11 21h10' stroke='%23d8bd81' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=20261002-human"><script defer src="vendor/lunar.js"></script><script defer src="knowledge.js"></script><script defer src="engine.js"></script><script defer src="app.js?v=20261002-visible-min"></script><style id="site-home-style">.site-home-button{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));width:44px;height:44px;display:grid;place-items:center;z-index:100;border:1px solid #a68b516e;border-radius:4px;background:#15251deb;color:#d8bd81;text-decoration:none;box-shadow:0 4px 16px #0003}.site-home-button:hover{background:#2a3b2c;border-color:#d8bd81}.site-home-button:focus-visible{outline:2px solid #ecd5a0;outline-offset:3px}.site-home-button svg{width:22px;height:22px}.site-home-button+header{padding-inline:64px}</style></head>
<body><a class="site-home-button" href="/" aria-label="返回主页" title="返回主页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/></svg></a><header><div class="brand"><span class="seal" aria-hidden="true">衡</span><strong>延西易创</strong></div></header><main>
<section id="input-screen" class="screen"><div class="section-heading"><span class="eyebrow">八字 · 五行</span><h1>输入出生信息</h1></div><form id="birth-form" novalidate><fieldset id="birth-fields"><div class="segmented" role="group" aria-label="历法"><button type="button" data-mode="solar" class="selected" aria-pressed="true">公历</button><button type="button" data-mode="lunar" aria-pressed="false">农历 / 阴历</button></div><div class="date-grid"><label>出生年<input id="year" type="number" inputmode="numeric" min="1901" max="2099" placeholder="如 1990" required></label><label>月<select id="month" aria-label="出生月份"></select></label><label>日<select id="day" aria-label="出生日期"></select></label></div><label id="leap-row" class="check-row" hidden><input id="leap" type="checkbox">闰月</label><div class="time-grid"><label>出生时<select id="hour" aria-label="出生时"></select></label><label>分<select id="minute" aria-label="出生分"></select></label></div><p class="input-note">按北京时间填写 · 时辰不清楚可选择“不确定”</p></fieldset><p id="form-error" class="error" role="alert" hidden></p><button type="submit" id="query-button" class="primary">查询</button></form></section>
<section id="loading-screen" class="screen loading" hidden aria-live="polite"><div class="loading-mark" aria-hidden="true">衡</div><h1>测算中</h1><p class="muted">正在整理你的八字与五行</p><div id="progress" class="progress" role="progressbar" aria-label="测算进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div><p id="progress-text" class="progress-text">0%</p></section>
<section id="result-screen" class="screen" hidden><div class="result-heading"><h1 tabindex="-1" id="result-title">八字简要</h1><button type="button" id="edit-button" class="text-button">重新查询</button></div><p id="birth-summary" class="muted"></p><div id="pillars" class="pillars" aria-label="八字四柱"></div><div class="stats-heading"><h2>五行统计</h2><span id="stats-note" class="muted"></span></div><div id="element-stats" class="element-stats"></div><p id="result-note" class="result-note"></p><button type="button" id="analysis-button" class="primary">五行分析</button></section>
</main><footer>传统文化参考 · 不代表财运或健康预测</footer>
<dialog id="analysis-dialog" aria-labelledby="dialog-title"><div class="dialog-inner"><div class="dialog-header"><h2 id="dialog-title">五行分析</h2><button id="close-dialog" type="button" aria-label="关闭弹窗" class="close-button">×</button></div><div id="analysis-answers"></div><p class="dialog-note">传统五行参考。</p><button id="confirm-dialog" type="button" class="primary">知道了</button><button id="human-analysis-button" type="button" class="primary human-analysis-button">付费人工深度解析</button><p id="human-analysis-status" class="human-analysis-status" role="status" hidden></p></div></dialog></body></html>
